<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progressive Semantic Fingerprinting - Demo & Download</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --accent: #6c63ff;
            --accent2: #ff6b9d;
            --text: #e4e4e7;
            --text-dim: #8b8d9a;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg,
                    var(--accent),
                    var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .btn-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        button {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button:hover {
            border-color: var(--accent);
            background: rgba(108, 99, 255, 0.1);
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        button.primary:hover {
            background: #5b52e0;
        }

        button.download {
            background: linear-gradient(135deg,
                    var(--accent),
                    var(--accent2));
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 0.8rem 2rem;
            font-size: 1rem;
        }

        button.download:hover {
            opacity: 0.9;
        }

        textarea,
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus,
        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .output {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            font-family: "Consolas", "SF Mono", monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            color: var(--text-dim);
        }

        .output .success {
            color: var(--success);
        }

        .output .warn {
            color: var(--warning);
        }

        .output .accent {
            color: var(--accent);
        }

        .output .pink {
            color: var(--accent2);
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat-item {
            background: var(--bg);
            border-radius: 8px;
            padding: 0.75rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Progressive Semantic Fingerprinting DB (PsfDB)</h1>
        <p class="subtitle">
            A lightweight search system that adopts Progressive Semantic Fingerprinting
        </p>


        <!-- Demo: Text Search -->
        <div class="card">
            <h2>Text Search Demo</h2>
            <div class="form-group">
                <label>Sample Data Registration</label>
                <button class="primary" onclick="loadTextSamples()">
                    Sample Data Registration
                </button>
                <button onclick="clearDB()">DB Clear</button>
                <br />
                <textarea id="inputdata" rows="3" cols="35"></textarea>
                <button class="primary" onclick="loadTextSamples2()">
                    Add Data
                </button>
            </div>
            <div class="form-group">
                <label>Search Query</label>
                <input type="text" id="textQuery" placeholder="Example: human psychology" />
            </div>
            <div class="btn-row">
                <button class="primary" onclick="searchText()">Search</button>
            </div>
            <div class="stats" id="dbStats"></div>
            <div class="output" id="textOutput">
                Results will be displayed here
            </div>
        </div>

        <!-- Demo: JSON Search -->
        <div class="card">
            <h2>JSON Search Demo</h2>
            <div class="form-group">
                <label>Sample JSON Registration</label>
                <button class="primary" onclick="loadJsonSamples()">
                    Sample JSON Registration
                </button>
                <br />
                <textarea id="inputjson" rows="3" cols="35"></textarea>
                <button class="primary" onclick="loadJSONSamples2()">
                    Add Data
                </button>
            </div>
            <div class="form-group">
                <label>JSON Search Query</label>
                <textarea id="jsonQuery" rows="3" placeholder='{"name": "wireless", "price": 50}'></textarea>
            </div>
            <div class="btn-row">
                <button class="primary" onclick="searchJson()">
                    JSON Search
                </button>
            </div>
            <div class="output" id="jsonOutput">
                Results will be displayed here
            </div>
        </div>

        <!-- Unit Test -->
        <div class="card">
            <h2>Unit Test</h2>
            <button class="primary" onclick="runTests()">
                Run All Tests
            </button>
            <div class="output" id="testOutput" style="margin-top: 1rem">
                Test results will be displayed here
            </div>
        </div>
    </div>

        window.loadTextSamples = async () => {
            const out = document.getElementById("textOutput");
            out.innerHTML =
                '<span class="accent">Adding text samples...</span>\n';
            try {
                await db.initialize();
                await db.addBatch(textSamples);
                const stats = await db.getStats();
                out.innerHTML += `<span class="success">✓ ${textSamples.length} Added</span>\n`;
                out.innerHTML += `<span class="accent">Total DB: ${stats.total}</span>\n`;
                updateStats(stats);
            } catch (e) {
                out.innerHTML += `<span class="warn">✗ Error: ${e.message}</span>\n`;
            }
        };
        window.loadTextSamples2 = async () => {
            const out = document.getElementById("textOutput");
            out.innerHTML =

            try {
                let tarr = document
                    .getElementById("inputdata")
                    .value.split("\n");
                userdata.samples = [...tarr];
                await db.initialize();
                await db.addBatch(tarr);
                const stats = await db.getStats();
                out.innerHTML += `<span class="success">✓ ${textSamples.length} Added</span>\n`;

                const stats = await db.getStats();

        window.loadJSONSamples2 = async () => {
            const out = document.getElementById("jsonOutput");
            out.innerHTML =
                '<span class="accent">Adding JSON samples...</span>\n';
            let rawjson = JSON.parse(
                document.getElementById("inputjson").value,
            );
            console.log(rawjson);
            try {
                await db.initialize();
                await db.addBatch(rawjson);
                const stats = await db.getStats();
                out.innerHTML += `<span class="success">✓ ${jsonSamples.length} Added</span>\n`;
                updateStats(stats);
            } catch (e) {
                console.log(e);
                out.innerHTML += `<span class="warn">✗ Error: ${e.message}</span>\n`;
            }
        };

        window.searchText = async () => {
            const query = document.getElementById("textQuery").value.trim();
            const out = document.getElementById("textOutput");
            if (!query) {
                out.innerHTML =
                    '<span class="warn">Please enter a query</span>';
                return;
            }

            out.innerHTML = `<span class="accent">Searching for: "${query}"</span>\n`;
            const start = performance.now();
            try {
                const results = await db.search(query, {
                    limit: 15,
                    threshold: 0.01,
                });
                const elapsed = (performance.now() - start).toFixed(2);
                out.innerHTML += `<span class="success">✓ ${results.length} hits (${elapsed}ms)</span>\n\n`;
                for (const r of results) {
                    const bar = "█".repeat(Math.floor(r.similarity * 20));
                    out.innerHTML += `<span class="pink">${r.similarity.toFixed(4)}</span> ${bar}\n`;
                    out.innerHTML += `  ${typeof r.data === "string" ? r.data : JSON.stringify(r.data)}\n\n`;
                }
                //---diff: normal search for string
                const start2 = performance.now();
                const ret2 = userdata.samples.filter((v) => {
                    if (v.indexOf(query) > -1) return true;
                    return false;
                });
                const elapsed2 = (performance.now() - start2).toFixed(2);
                out.innerHTML += "<b>Normal search for diff</b>\n\n";
                out.innerHTML += `<span class="success">✓ ${ret2.length} hits (${elapsed2}ms)</span>\n\n`;
                for (const r of ret2) {
                    out.innerHTML += `<span class="pink">1.0</span>\n`;
                    out.innerHTML += `  ${r}\n\n`;
                }
            } catch (e) {
                out.innerHTML += `<span class="warn">✗ Error: ${e.message}</span>\n`;
            }
        };

        window.searchJson = async () => {
            const raw = document.getElementById("jsonQuery").value.trim();
            const out = document.getElementById("jsonOutput");
            if (!raw) {
                out.innerHTML =
                    '<span class="warn">Please enter a JSON query</span>';
                return;
            }

            let query;
            try {
                query = JSON.parse(raw);
            } catch (e) {
                out.innerHTML = `<span class="warn">JSON format is invalid: ${e.message}</span>`;
                return;
            }

            out.innerHTML = `<span class="accent">Searching JSON...</span>\n`;

            // デバッグ: クエリの内容を表示
            out.innerHTML += `<span class="accent">Parsed query: ${JSON.stringify(query)}</span>\n`;
            out.innerHTML += `<span class="accent">Query keys: ${Object.keys(query).join(", ")}</span>\n`;

            // デバッグ: DB内のレコード確認
            const allRecords = await db.getAll();
            const jsonRecords = allRecords.filter(
                (r) => r.dataType === "json",
            );
            console.log(jsonRecords);
            out.innerHTML += `<span class="accent">JSON records in DB: ${jsonRecords.length}</span>\n`;

            if (jsonRecords.length > 0) {
                const sample = jsonRecords[0];
                const hasFVI = sample.fingerprint?.layers?.fieldValueIndex;
                out.innerHTML += `<span class="accent">fieldValueIndex exists: ${!!hasFVI}</span>\n`;
                if (hasFVI) {
                    out.innerHTML += `<span class="accent">fieldValueIndex content: ${JSON.stringify(hasFVI.slice(0, 2))}</span>\n`;
                }
            }

            out.innerHTML += "\n";

            const start = performance.now();
            try {
                const results = await db.search(query, {
                    limit: 5,
                    threshold: 0.01,
                    dataType: "json",
                });
                const elapsed = (performance.now() - start).toFixed(2);
                out.innerHTML += `<span class="success">✓ ${results.length} hits (${elapsed}ms)</span>\n\n`;
                for (const r of results) {
                    const bar = "█".repeat(Math.floor(r.similarity * 20));
                    out.innerHTML += `<span class="pink">${r.similarity.toFixed(4)}</span> ${bar}\n`;
                    out.innerHTML += `  ${JSON.stringify(r.data, null, 2)}\n\n`;
                }
            } catch (e) {
                out.innerHTML += `<span class="warn">✗ Error: ${e.message}\n${e.stack}</span>\n`;
            }
        };

        window.clearDB = async () => {
            await db.clear();
            document.getElementById("textOutput").innerHTML =
                '<span class="success">✓ DB cleared</span>';
            document.getElementById("dbStats").innerHTML = "";
        };

        function updateStats(stats) {
            const el = document.getElementById("dbStats");
            el.innerHTML = `
        <div class="stat-item"><div class="stat-value">${stats.total}</div><div class="stat-label">Total</div></div>
        ${Object.entries(stats.byType)
                    .map(
                        ([k, v]) =>
                            `<div class="stat-item"><div class="stat-value">${v}</div><div class="stat-label">${k}</div></div>`,
                    )
                    .join("")}
      `;
        }

        // ---- Tests ----
        window.runTests = async () => {
            const out = document.getElementById("testOutput");
            out.innerHTML =
                '<span class="accent">Running tests...</span>\n\n';
            let pass = 0,
                fail = 0;

            function assert(label, condition) {
                if (condition) {
                    pass++;
                    out.innerHTML += `<span class="success">  ✓ ${label}</span>\n`;
                } else {
                    fail++;
                    out.innerHTML += `<span class="warn">  ✗ ${label}</span>\n`;
                }
            }

            // Test 1: 基本生成
            try {
                const fp = new SemanticFingerprint("test string");
                assert(
                    "text fingerprint generation",
                    fp.layers.charHash !== null &&
                    fp.layers.ngramHash !== null,
                );
            } catch (e) {
                fail++;
                out.innerHTML += `<span class="warn">  ✗ text fingerprint generation: ${e.message}</span>\n`;
            }

            // Test 2: JSON生成
            try {
                const fp = new SemanticFingerprint({
                    key: "value",
                    num: 42,
                });
                assert(
                    "JSON fingerprint generation",
                    fp.layers.structureHash !== null &&
                    fp.layers.keyPathIndex !== null,
                );
            } catch (e) {
                fail++;
                out.innerHTML += `<span class="warn">  ✗ JSON fingerprint generation: ${e.message}</span>\n`;
            }

            // Test 3: 同一テキストの類似度 = 1.0
            try {
                const fp1 = new SemanticFingerprint("human psychology");
                const fp2 = new SemanticFingerprint("human psychology");
                const sim = fp1.similarity(fp2);
                assert(
                    `same text similarity = ${sim.toFixed(4)} (expected: 1.0)`,
                    sim > 0.99,
                );
            } catch (e) {
                fail++;
                out.innerHTML += `<span class="warn">  ✗ same text: ${e.message}</span>\n`;
            }

            // Test 4: 類似テキスト > 無関係テキスト
            try {
                const base = new SemanticFingerprint(
                    "マンション管理組合の修繕積立金",
                );
                const similar = new SemanticFingerprint(
                    "修繕積立金の値上げを管理組合で議論",
                );
                const unrelated = new SemanticFingerprint(
                    "今日の天気は晴れです",
                );
                const simA = base.similarity(similar);
                const simB = base.similarity(unrelated);
                assert(
                    `類似(${simA.toFixed(3)}) > 無関係(${simB.toFixed(3)})`,
                    simA > simB,
                );
            } catch (e) {
                fail++;
                out.innerHTML += `<span class="warn">  ✗ 類似度比較: ${e.message}</span>\n`;
            }

            // Test 5: シリアライズ/デシリアライズ
            try {
                const fp1 = new SemanticFingerprint("シリアライズテスト");
                const serialized = fp1.serialize();
                const fp2 = SemanticFingerprint.deserialize(serialized);
                const sim = fp1.similarity(fp2);
                assert(
                    `シリアライズ復元後の類似度 = ${sim.toFixed(4)}`,
                    sim > 0.99,
                );
            } catch (e) {
                fail++;
                out.innerHTML += `<span class="warn">  ✗ シリアライズ: ${e.message}</span>\n`;
            }

            // Test 6: DB保存と検索
            try {
                const testDb = new PsfDB(
                    "PSF_Test_" + Date.now(),
                    1,
                );
                await testDb.initialize();
                await testDb.addBatch([
                    "りんごは赤い果物",
                    "バナナは黄色い果物",
                    "車は道路を走る",
                ]);
                const results = await testDb.search("果物の色", {
                    limit: 3,
                    threshold: 0.01,
                });
                assert(
                    `DB検索: ${results.length}件ヒット`,
                    results.length > 0,
                );
                testDb.close();
            } catch (e) {
                fail++;
                out.innerHTML += `<span class="warn">  ✗ DB検索: ${e.message}</span>\n`;
            }

            // Test 7: 日本語トークナイズ
            try {
                const fp = new SemanticFingerprint(
                    "東京都渋谷区のマンション",
                );
                const tokens = fp.tokenize("東京都渋谷区のマンション");
                assert(
                    `日本語トークン数: ${tokens.length}`,
                    tokens.length > 1,
                );
            } catch (e) {
                fail++;
                out.innerHTML += `<span class="warn">  ✗ 日本語トークン: ${e.message}</span>\n`;
            }

            // Test 8: 英語テキスト
            try {
                const fp1 = new SemanticFingerprint(
                    "The quick brown fox jumps over the lazy dog",
                );
                const fp2 = new SemanticFingerprint(
                    "A fast brown fox leaps over a sleepy dog",
                );
                const sim = fp1.similarity(fp2);
                assert(`英語類似文 類似度 = ${sim.toFixed(4)}`, sim > 0.1);
            } catch (e) {
                fail++;
                out.innerHTML += `<span class="warn">  ✗ 英語テキスト: ${e.message}</span>\n`;
            }

            out.innerHTML += `\n<span class="${fail === 0 ? "success" : "warn"}">結果: ${pass} passed / ${fail} failed</span>\n`;
        };

    </script>
</body>
